<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPU2S Farm 🌷 - Smart Agriculture</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen" style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: white; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center;">
        
        <h2>Chào mừng đến HPU2 Farm 🌿</h2>
        <p>Vui lòng đăng nhập để tiếp tục</p>
        
        <input type="text" placeholder="Tên đăng nhập" style="padding: 10px; margin: 10px; width: 80%; max-width: 300px;">
        <input type="password" placeholder="Mật khẩu" style="padding: 10px; margin: 10px; width: 80%; max-width: 300px;">
        
        <button onclick="handleLogin()" style="
            padding: 12px 30px; background: #28a745; color: white;
            border: none; border-radius: 25px; font-size: 16px; cursor: pointer;">
            Vào Vườn 🌷
        </button>
    </div>

    <div id="dashboardScreen" style="display: none; padding: 20px;">
        
        <h1>Hệ Thống Giám Sát Cây Trồng</h1>
        <hr>

        <div class="camera-section" style="background: #f4f4f4; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px;">
            <h3>🎥 Chẩn đoán thời gian thực</h3>
            
            <div style="position: relative; display: inline-block;">
                <video id="video" autoplay playsinline style="width: 100%; max-width: 500px; border-radius: 10px; background: #000; display: none;"></video>
                <div id="realtime-result" style="margin-top: 10px; font-weight: bold; font-size: 18px; min-height: 30px;">Sẵn sàng quét...</div>
            </div>
            <canvas id="canvas" style="display:none;"></canvas>

            <div style="margin-top: 10px;">
                <button onclick="startRealTimeCamera()" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px;">🚀 Bật Camera</button>
                <button onclick="stopScanning()" style="background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 5px; margin-left: 10px;">🛑 Dừng</button>
            </div>
        </div>

        <div class="report-section" style="border: 1px solid #ddd; padding: 15px; border-radius: 10px;">
            <h3>📊 Báo Cáo Chi Tiết</h3>
            
            <div id="plantStatus" class="status-display" style="font-weight: bold; margin-bottom: 10px;">
                Chưa có dữ liệu
            </div>

            <table style="width: 100%; text-align: left;">
                <tr>
                    <td style="font-weight: bold; width: 100px;">Tên bệnh:</td>
                    <td id="aiDiseaseName">---</td>
                </tr>
                <tr>
                    <td style="font-weight: bold;">Nguyên nhân:</td>
                    <td id="aiCause">---</td>
                </tr>
                <tr>
                    <td style="font-weight: bold;">Giải pháp:</td>
                    <td id="aiSolution">---</td>
                </tr>
            </table>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
